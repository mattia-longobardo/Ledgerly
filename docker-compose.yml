name: projects

services:

# Ledgerly # --------------------------------------------------------------------------------------------------------------

  ledgerly:
    build: .
    image: ledgerly:latest
    container_name: ledgerly
    user: "1000:1000"
    env_file:
      - .env.homelab
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.ledgerly-router.rule=Host(`dash.longobardo.me`)"
      - "traefik.http.routers.ledgerly-router.entrypoints=web"
      - "traefik.http.routers.ledgerly-router.middlewares=lan-only@file,ledgerly-https"
      - "traefik.http.middlewares.ledgerly-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.ledgerly-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - db_internal
      - mail_internal

# Ledgerly Cron # --------------------------------------------------------------------------------------------------------------

  ledgerly-cron:
    build: ./cron
    image: ledgerly-cron:latest
    container_name: ledgerly-cron
    user: "1000:1000"
    depends_on:
      ledgerly:
        condition: service_healthy
    env_file:
      - .env.homelab
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep supercronic > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - db_internal

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
