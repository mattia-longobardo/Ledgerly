name: ledgerly

services:

# Ledgerly # --------------------------------------------------------------------------------------------------------------

  # The server (rewrite plan R4): `/api` and `/.well-known` — the API, MCP, Better Auth, OAuth, the
  # health check — and the migrations, which it applies as it starts. The interface is `ledgerly-web`.
  ledgerly:
    build:
      context: .
      target: server
    image: ledgerly:latest
    container_name: ledgerly
    user: "1000:1000"
    env_file:
      - .env.homelab
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      # Above `ledgerly-web-router`, which takes the rest of the host.
      - "traefik.http.routers.ledgerly-router.rule=Host(`${LEDGERLY_HOST:-dash.longobardo.me}`) && (PathPrefix(`/api`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.ledgerly-router.priority=100"
      - "traefik.http.routers.ledgerly-router.entrypoints=web"
      - "traefik.http.routers.ledgerly-router.middlewares=ledgerly-https"
      - "traefik.http.routers.ledgerly-router.service=ledgerly-service"
      # The signed addresses of the originals (UI-PAY-2): the token is in the path, so this router
      # keeps them out of the access log (which logs only 400-599 anyway). Same middleware, same service.
      - "traefik.http.routers.ledgerly-originals-router.rule=Host(`${LEDGERLY_HOST:-dash.longobardo.me}`) && PathPrefix(`/api/v1/originals/`)"
      - "traefik.http.routers.ledgerly-originals-router.priority=200"
      - "traefik.http.routers.ledgerly-originals-router.entrypoints=web"
      - "traefik.http.routers.ledgerly-originals-router.middlewares=ledgerly-https"
      - "traefik.http.routers.ledgerly-originals-router.service=ledgerly-service"
      - "traefik.http.routers.ledgerly-originals-router.observability.accessLogs=false"
      - "traefik.http.middlewares.ledgerly-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.ledgerly-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - db_internal
      - mail_internal
      - ledgerly_plugins
      - ledgerly_egress
      - ledgerly_internal

# Ledgerly Web # --------------------------------------------------------------------------------------------------------------

  # The interface (rewrite plan R4): the pages, which read and write through `/api/v1` and ask
  # `ledgerly` for the session on `ledgerly_internal`. No database address, no key of the server:
  # its environment is the list below and `.env.web`, which holds public values only
  # (`OIDC_DISCOVERY_URL`, `INSTANCE_CONTACT`); `tools/web-env.test.ts` holds both to an allowlist.
  ledgerly-web:
    build:
      context: .
      target: web
    image: ledgerly-web:latest
    container_name: ledgerly-web
    user: "1000:1000"
    env_file:
      - path: .env.web
        required: false
    environment:
      LEDGERLY_API_URL: http://ledgerly:3000
    depends_on:
      ledgerly:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      # A page drawn without a session: the process renders, and it needs no database.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/privacy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.ledgerly-web-router.rule=Host(`${LEDGERLY_HOST:-dash.longobardo.me}`)"
      - "traefik.http.routers.ledgerly-web-router.priority=10"
      - "traefik.http.routers.ledgerly-web-router.entrypoints=web"
      - "traefik.http.routers.ledgerly-web-router.middlewares=ledgerly-https"
      - "traefik.http.routers.ledgerly-web-router.service=ledgerly-web-service"
      - "traefik.http.services.ledgerly-web-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - ledgerly_internal

# Ledgerly Worker # --------------------------------------------------------------------------------------------------------------

  # The jobs and the syncs (rewrite plan R1): the image of `ledgerly`, another command. Its own
  # scheduler and the queue `job_queue` in the database; no port, no Traefik. One worker only.
  # `ledgerly` applies the migrations as it starts: the worker starts after it is healthy.
  ledgerly-worker:
    image: ledgerly:latest
    container_name: ledgerly-worker
    command: ["node", "/app/worker.mjs"]
    user: "1000:1000"
    depends_on:
      ledgerly:
        condition: service_healthy
    env_file:
      - .env.homelab
    environment:
      # Its own pool of connections, named in `pg_stat_activity`.
      PGAPPNAME: ledgerly-worker
    restart: unless-stopped
    # What a stop waits for the tasks running (25 s in `apps/worker/src/main.ts`), and a margin.
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "node", "/app/worker.mjs", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"
    # The database, the mail, the plugins and the egress proxy's door (`ledgerly_plugins`, internal);
    # `ledgerly_egress` is its way to the internet (the exchanges, the ECB, the holidays).
    networks:
      - db_internal
      - mail_internal
      - ledgerly_plugins
      - ledgerly_egress

# Ledgerly Plugin Enable Banking # --------------------------------------------------------------------------------------------------------------

  # A plugin of the standard installation (docs/operations.md, "Plugins"): stateless, called only by
  # `ledgerly` on `ledgerly_plugins`, which is internal. It has no database address, no encryption
  # key and no volume. Its file holds the secret it shares with the core and its proxy address
  # (`HTTPS_PROXY`, with its own credentials): it reaches the internet through `ledgerly-egress` only.
  ledgerly-plugin-enablebanking:
    build:
      context: .
      dockerfile: plugins/enablebanking/Dockerfile
    image: ledgerly-plugin-enablebanking:latest
    container_name: ledgerly-plugin-enablebanking
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not required: without the file the plugin refuses to start, and the rest of the stack — the
    # app first — still does. A missing file must never stop `docker compose` for `ledgerly`.
    env_file:
      - path: .env.plugin-enablebanking
        required: false
    environment:
      # `fetch` goes through `HTTPS_PROXY` of the file above (Node 24+).
      NODE_USE_ENV_PROXY: "1"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins

# Ledgerly Plugin Wallet # --------------------------------------------------------------------------------------------------------------

  # A plugin of the standard installation, as `ledgerly-plugin-enablebanking`: reads the accounts and the movements of
  # Wallet with each person's token (`rest.budgetbakers.com`).
  ledgerly-plugin-wallet:
    build:
      context: .
      dockerfile: plugins/wallet/Dockerfile
    image: ledgerly-plugin-wallet:latest
    container_name: ledgerly-plugin-wallet
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.plugin-wallet
        required: false
    environment:
      NODE_USE_ENV_PROXY: "1"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins

# Ledgerly Plugin Trek # --------------------------------------------------------------------------------------------------------------

  # A plugin of the standard installation, as `ledgerly-plugin-enablebanking`: keeps the leave days level with each
  # person's own Trek; the core grants the proxy that person's host before each call.
  ledgerly-plugin-trek:
    build:
      context: .
      dockerfile: plugins/trek/Dockerfile
    image: ledgerly-plugin-trek:latest
    container_name: ledgerly-plugin-trek
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.plugin-trek
        required: false
    environment:
      NODE_USE_ENV_PROXY: "1"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins

# Ledgerly Plugin Prices # --------------------------------------------------------------------------------------------------------------

  # The prices plugin (R5d; docs/operations.md, "Plugins"): the daily closes from Yahoo Finance, for
  # the instance, as `ledgerly-plugin-enablebanking`: it reaches Yahoo Finance through
  # `ledgerly-egress` only.
  ledgerly-plugin-prices:
    build:
      context: .
      dockerfile: plugins/prices/Dockerfile
    image: ledgerly-plugin-prices:latest
    container_name: ledgerly-plugin-prices
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.plugin-prices
        required: false
    environment:
      NODE_USE_ENV_PROXY: "1"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins

# Ledgerly Egress # --------------------------------------------------------------------------------------------------------------

  # The plugins' only way to the internet (rewrite plan R5c, decisions I8, D1; docs/operations.md,
  # "Plugins"): a forward proxy of the repository. `CONNECT` to port 443 only, each plugin with its
  # own credentials, to the hosts of its catalog entry or of a short grant of the core, and never to
  # a private, loopback, link-local or Docker address. Port 3128 for the plugins, 8081 for the core
  # (`POST /grants`, `GET /health`). Its file holds the secrets (`EGRESS_SECRETS`,
  # `EGRESS_ADMIN_SECRET`); nothing is stored.
  ledgerly-egress:
    build:
      context: .
      dockerfile: apps/egress/Dockerfile
    image: ledgerly-egress:latest
    container_name: ledgerly-egress
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not required, as a plugin's: without it the proxy refuses to start, and the app still does.
    env_file:
      - path: .env.egress
        required: false
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins
      - ledgerly_egress

networks:
  # The interface and the server, and nothing else (rewrite plan R4): the interface asks the server
  # for the session. `internal`: no way out of the host from here.
  ledgerly_internal:
    name: ledgerly_internal
    internal: true
  # The core, its plugins and the egress proxy, and nothing else: a plugin is not on `db_internal`,
  # `proxy_public` or `mail_internal`. `internal`: a plugin goes out through `ledgerly-egress` only.
  ledgerly_plugins:
    name: ledgerly_plugins
    internal: true
  # The way out of the egress proxy and of the core (`ledgerly`, `ledgerly-worker`): the providers
  # the core still calls itself (the exchanges, the ECB, the holidays, OIDC). No plugin is on it.
  ledgerly_egress:
    name: ledgerly_egress
  proxy_public:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
