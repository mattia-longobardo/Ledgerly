name: ledgerly

services:

# Ledgerly # --------------------------------------------------------------------------------------------------------------

  ledgerly:
    build: .
    image: ledgerly:latest
    container_name: ledgerly
    user: "1000:1000"
    env_file:
      - .env.homelab
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.ledgerly-router.rule=Host(`${LEDGERLY_HOST:-dash.longobardo.me}`)"
      - "traefik.http.routers.ledgerly-router.entrypoints=web"
      - "traefik.http.routers.ledgerly-router.middlewares=ledgerly-https"
      - "traefik.http.middlewares.ledgerly-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.ledgerly-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - db_internal
      - mail_internal
      - ledgerly_plugins

# Ledgerly Worker # --------------------------------------------------------------------------------------------------------------

  # The jobs and the syncs (rewrite plan R1): the image of `ledgerly`, another command. Its own
  # scheduler and the queue `job_queue` in the database; no port, no Traefik. One worker only.
  # `ledgerly` applies the migrations as it starts: the worker starts after it is healthy.
  ledgerly-worker:
    image: ledgerly:latest
    container_name: ledgerly-worker
    command: ["node", "/app/worker.mjs"]
    user: "1000:1000"
    depends_on:
      ledgerly:
        condition: service_healthy
    env_file:
      - .env.homelab
    environment:
      # Its own pool of connections, named in `pg_stat_activity`.
      PGAPPNAME: ledgerly-worker
    restart: unless-stopped
    # What a stop waits for the tasks running (25 s in `apps/worker/src/main.ts`), and a margin.
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "node", "/app/worker.mjs", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"
    # The database, the mail, the plugins; `ledgerly_plugins` is also its way to the providers
    # on the internet (Wallet, Trek, the exchanges, the ECB).
    networks:
      - db_internal
      - mail_internal
      - ledgerly_plugins

# Ledgerly Plugin Enable Banking # --------------------------------------------------------------------------------------------------------------

  # A plugin of the standard installation (docs/operations.md, "Plugins"): stateless, called only by
  # `ledgerly` on `ledgerly_plugins`. It has no database address, no encryption key and no volume;
  # its one variable is the secret it shares with the core, in a file of its own.
  ledgerly-plugin-enablebanking:
    build:
      context: .
      dockerfile: plugins/enablebanking/Dockerfile
    image: ledgerly-plugin-enablebanking:latest
    container_name: ledgerly-plugin-enablebanking
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not required: without the file the plugin refuses to start, and the rest of the stack — the
    # app first — still does. A missing file must never stop `docker compose` for `ledgerly`.
    env_file:
      - path: .env.plugin-enablebanking
        required: false
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
    networks:
      - ledgerly_plugins

networks:
  # The core and its plugins, and nothing else: a plugin is not on `db_internal`, `proxy_public` or
  # `mail_internal`. Not `internal`: a plugin calls its provider on the internet.
  ledgerly_plugins:
    name: ledgerly_plugins
  proxy_public:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
