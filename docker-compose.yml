name: projects

services:

# Dashboard App (Next.js standalone + Drizzle migrations) # ---------------------------------------------------------------------

  dashboard-app:
    build: ./dashboard-app
    image: dashboard:latest
    container_name: dashboard-app
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - DATABASE_URL=postgresql://dashboard:${DB_DASHBOARD_PASSWORD}@postgres:5432/dashboard
      - AUTH_URL=https://${DASHBOARD_HOST}
      - AUTH_SECRET=${DASHBOARD_AUTH_SECRET}
      - OIDC_ISSUER=https://${AUTHENTIK_HOST}/application/o/dashboard/
      - OIDC_CLIENT_ID=${DASHBOARD_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${DASHBOARD_OIDC_CLIENT_SECRET}
      - AUTHORIZED_SUB=${DASHBOARD_AUTHORIZED_SUB}
      - WALLET_TOKEN_FILE=/secrets/wallet-token
      - PAPERLESS_URL=https://${PAPERLESS_HOST}
      - PAPERLESS_TOKEN=${DASHBOARD_PAPERLESS_TOKEN}
      - CRON_SECRET=${DASHBOARD_CRON_SECRET}
      - WEBHOOK_SECRET=${DASHBOARD_WEBHOOK_SECRET}
      - GOTIFY_URL=${GOTIFY_URL}
      - GOTIFY_TOKEN=${DASHBOARD_GOTIFY_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - TREK_URL=https://${TREK_HOST}
      - TREK_TOKEN_FILE=/secrets/trek-token
    volumes:
      - ./secrets/wallet-token:/secrets/wallet-token:ro
      - ./secrets/trek-token:/secrets/trek-token:ro
    tmpfs:
      - /tmp
      - /app/.next/cache
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.dashboard-router.rule=Host(`${DASHBOARD_HOST}`)"
      - "traefik.http.routers.dashboard-router.entrypoints=web"
      - "traefik.http.services.dashboard-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.dashboard-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.dashboard-router.middlewares=dashboard-https"
    networks:
      - proxy_public
      - db_internal

# Dashboard Cron (supercronic sidecar) # ----------------------------------------------------------------------------------------

  dashboard-cron:
    build: ./cron
    image: dashboard-cron:latest
    container_name: dashboard-cron
    user: "1000:1000"
    depends_on:
      dashboard-app:
        condition: service_healthy
    command: ["-passthrough-logs", "/etc/crontab"]
    environment:
      - TZ=Europe/Rome
      - CRON_SECRET=${DASHBOARD_CRON_SECRET}
    volumes:
      - ./cron/crontab:/etc/crontab:ro
    tmpfs:
      - /tmp
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "pgrep", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "autoheal=true"
    networks:
      - proxy_public

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
