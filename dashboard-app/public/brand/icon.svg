<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Finance Dashboard">
  <title>Finance Dashboard</title>
  <rect width="512" height="512" rx="112" fill="#0c0e12"/>
  <g transform="translate(64,62) scale(8)">
    <!-- Axis rule: hairline, overshooting the glyph on both sides so it reads as a
         chart baseline the mark sits on, never as a third arm of the letter. -->
    <rect x="3" y="40" width="42" height="2.5" fill="#8b94a3"/>
    <rect x="8" y="6" width="6" height="30" fill="#e6eaf0"/>   <!-- stem -->
    <rect x="8" y="6" width="27" height="6" fill="#e6eaf0"/>   <!-- long bar -->
    <rect x="8" y="18" width="19" height="6" fill="#22d3ee"/>  <!-- short bar: the current value -->
  </g>
</svg>
