services:
  postgres-test:
    image: postgres:18-alpine
    container_name: dashboard-postgres-test
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dashboard_test
      # postgres:18 defaults PGDATA to a version-specific subdirectory and
      # refuses to start if it finds an "unused" mount at the pre-18 path
      # (/var/lib/postgresql/data) — since that's exactly where the tmpfs
      # below is mounted, pin PGDATA there so startup matches that layout.
      PGDATA: /var/lib/postgresql/data
    ports: ["55432:5432"]
    volumes:
      - ./tests/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: ["/var/lib/postgresql/data"]
