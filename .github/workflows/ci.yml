name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - if: hashFiles('**/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - run: make ci
